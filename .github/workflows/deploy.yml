name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 51799e9e2cfaf727a3bc287626828255

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the worker parses
        run: node --check worker/src/index.js
      - name: Build the site from app-src
        run: npm run build
      - name: Run the site tests (every tab, phone + desktop, light + dark)
        run: npm test
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-screenshots, path: tests/out, retention-days: 14 }

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Check the Cloudflare token
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty (repo Settings > Secrets and variables > Actions)"; exit 1; fi
          code=$(curl -s -o v.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "::notice::token verify HTTP $code $(tr -d '\n' < v.json | grep -o '"status":"[a-z]*"' | head -1)"
          [ "$code" = "200" ] || { echo "::error::Cloudflare rejected the token (HTTP $code)"; exit 1; }
      - name: Deploy the worker (sec-proxy)
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          set -o pipefail
          npx wrangler deploy --config worker/wrangler.jsonc --message "${{ github.sha }}" 2>&1 | tee w.log || { tail -25 w.log | grep -v '^\s*$' | sed 's/^/::error::/' ; exit 1; }
      - name: Deploy the site (Pages project ledgerline)
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          set -o pipefail
          npx wrangler pages deploy site --project-name=ledgerline --branch=main --commit-hash=${{ github.sha }} --commit-message="deploy ${{ github.sha }}" 2>&1 | tee p.log || { tail -25 p.log | grep -v '^\s*$' | sed 's/^/::error::/' ; exit 1; }
          grep -o 'https://[a-z0-9.-]*pages.dev[^ ]*' p.log | tail -1 | sed 's/^/::notice::site deployed /'
      - name: Smoke test the live worker
        run: |
          v=$(grep -o "WORKER_VERSION = '[0-9.]*'" worker/src/index.js | grep -o "[0-9.]*")
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS https://sec-proxy.mammothconstructors.workers.dev/mcp | grep -o "server [0-9.]*" | grep -o "[0-9.]*" || true)
            [ "$got" = "$v" ] && echo "worker $got live" && exit 0; sleep 10
          done
          echo "expected worker $v, live says $got"; exit 1
